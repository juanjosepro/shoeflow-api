# DESARROLLO LOCAL. Uso: docker compose -f docker-compose.dev.yml up --build
services:
  db:
    image: postgres:16-alpine
    networks:
      - shoeflow-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"        # solo en local, para DBeaver/pgAdmin

  app:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-dev.txt   # instala también django-extensions y dotenv
    container_name: shoeflow-api
    networks:
      - shoeflow-network
    volumes:
      - .:/app             # código en vivo: los cambios se reflejan sin reconstruir
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - db

  pgadmin:                 # herramienta solo de desarrollo
    image: dpage/pgadmin4
    networks:
      - shoeflow-network
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  shoeflow-network:
    external: true